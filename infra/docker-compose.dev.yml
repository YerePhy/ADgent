version: "3.9"

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../backend/src:/app/src
    env_file:
      - ../.env
    environment:
      - ENV=development

  worker:
    build:
      context: ../worker
      dockerfile: Dockerfile
    volumes:
      - ../worker/src:/app/src
    env_file:
      - ../.env
    environment:
      - ENV=development
