services:
  agent:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_PATH=${CONTAINER_DATABASE_PATH}
    stdin_open: true
    tty: true
    ports:
      - "7860:7860"
    volumes:
      - ./data:/app/data
      - ${LOCAL_DATABASE_PATH}:${CONTAINER_DATABASE_PATH}
