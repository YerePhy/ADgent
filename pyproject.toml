[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "lang-chain-project"
version = "0.1.0"
description = "Simple LangChain CLI chat agent."
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "Your Name", email = "you@example.com" }
]
dependencies = [
  "python-dotenv>=1.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "langgraph>=0.2",
  "langchain>=0.1",
  "langchain-community>=0.0.30",
  "langchain-huggingface>=0.0.3",
  "langsmith>=0.1.14",
  "huggingface-hub>=0.21",
  "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.26",
  "ruff>=0.2",
  "mypy>=1.8",
  "types-requests>=2.31.0.20240218",
]
neuroimaging = [
  "nilearn>=0.10",
  "nibabel>=5.2",
]

[project.urls]
homepage = "https://example.com"
repository = "https://example.com/lang-chain-project"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
  "backend",
]

[tool.hatch.envs.default]
type = "virtual"
path = ".venv"

[tool.hatch.envs.default.scripts]
start = "python -m backend.main"
test = "pytest"

[tool.ruff]
line-length = 100
