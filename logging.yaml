version: 1
disable_existing_loggers: false

formatters:
  default:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    formatter: default
    stream: ext://sys.stderr
  app_file:
    class: logging.FileHandler
    formatter: default
    filename: logs/app.log
    mode: a
    encoding: utf-8
  ingest_file:
    class: logging.FileHandler
    formatter: default
    filename: logs/ingest.log
    mode: a
    encoding: utf-8

root:
  level: INFO
  handlers: [console]

loggers:
  backend:
    level: INFO
    handlers: [console, app_file]
    propagate: false
  scripts:
    level: INFO
    handlers: [console, ingest_file]
    propagate: false
  docling:
    level: CRITICAL
  httpx:
    level: WARNING
  httpcore:
    level: WARNING
  sentence_transformers:
    level: WARNING
